spring.application.name=demo
mongock.migration-scan-package=tech.cidade.colab.infrastructure.migration

keycloak.base-url=${KEYCLOAK_BASE_URL}
keycloak.realm=${KEYCLOAK_REALM}
keycloak.auth.client-id=${KEYCLOAK_AUTH_CLIENT_ID}
keycloak.auth.client-secret=${KEYCLOAK_AUTH_CLIENT_SECRET}
keycloak.auth.grant-type=${KEYCLOAK_AUTH_GRANT_TYPE}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
keycloak.admin.grant-type=${KEYCLOAK_ADMIN_GRANT_TYPE}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

security.authorization.resource-client-id=${KEYCLOAK_RESOURCE_CLIENT_ID}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.base-url}/realms/${keycloak.realm}

keycloak.forgot-password.rate-limit.max-attempts=${FORGOT_PASSWORD_RATE_LIMIT_MAX:3}
keycloak.forgot-password.rate-limit.window-seconds=${FORGOT_PASSWORD_RATE_LIMIT_WINDOW_SECONDS:900}

password-reset.app-url=${PASSWORD_RESET_APP_URL}
password-reset.ttl-seconds=${PASSWORD_RESET_TTL_SECONDS:900}
password-reset.from=${MAIL_FROM:noreply@cidade-colab.local}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
